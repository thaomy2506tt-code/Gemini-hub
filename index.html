<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Script Valley - Stardew AI Manor</title>
  <style>
    :root { --bg:#090d16; --panel:#151d30; --border:#2b3954; --primary:#38bdf8; --accent:#f59e0b; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:var(--bg); color:var(--text); padding:8px; font-size:13px; user-select:none; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    header h1 { font-size:15px; color:#fde047; text-shadow:1px 1px 0 #78350f; }
    .btn-header { display:flex; gap:4px; }
    
    /* KHUNG THẾ GIỚI STARDEW VALLEY CANVAS */
    .game-viewport { position:relative; width:100%; height:285px; background:#1b2518; border:3px solid #78350f; border-radius:12px; overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,0.6); margin-bottom:8px; }
    #game-canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
    .clock-badge { position:absolute; top:6px; right:6px; background:rgba(15,23,42,0.85); border:1px solid #ca8a04; border-radius:6px; padding:3px 7px; font-size:10px; color:#fef08a; display:flex; align-items:center; gap:4px; pointer-events:none; }
    .hint-tap { position:absolute; bottom:6px; left:6px; background:rgba(15,23,42,0.75); padding:2px 6px; border-radius:4px; font-size:8.5px; color:#cbd5e1; pointer-events:none; }

    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px; margin-bottom:8px; }
    .card-title { font-size:12px; font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
    input, select, textarea, button { width:100%; border-radius:6px; border:1px solid var(--border); background:#0b1120; color:var(--text); padding:7px; font-size:12px; margin-bottom:5px; }
    .btn-action { background:#16a34a; color:#fff; font-weight:bold; border:none; cursor:pointer; padding:8px; }
    .btn-small { width:auto; font-size:10px; padding:3px 6px; margin:0; background:#24324d; border:1px solid #3b4d70; color:#fff; border-radius:4px; cursor:pointer; }
    .btn-active { background:#15803d; border-color:#22c55e; }
    
    .chat-container { height:260px; display:flex; flex-direction:column; }
    .chat-messages { flex:1; overflow-y:auto; background:#0b1120; border:1px solid var(--border); border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
    .msg-row { display:flex; flex-direction:column; width:100%; max-width:96%; }
    .msg-sender { font-size:9.5px; font-weight:bold; margin-bottom:2px; }
    .msg-content { padding:6px 8px; border-radius:6px; font-size:11.5px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
    .msg-user { align-self:flex-end; } .msg-user .msg-sender { color:#38bdf8; text-align:right; } .msg-user .msg-content { background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.3); }
    .msg-a1 { align-self:flex-start; } .msg-a1 .msg-sender { color:#818cf8; } .msg-a1 .msg-content { background:rgba(129,140,248,0.12); border:1px solid rgba(129,140,248,0.3); }
    .msg-a2 { align-self:flex-start; } .msg-a2 .msg-sender { color:#34d399; } .msg-a2 .msg-content { background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.3); }
    .msg-a3 { align-self:flex-start; } .msg-a3 .msg-sender { color:#f472b6; } .msg-a3 .msg-content { background:rgba(244,114,182,0.12); border:1px solid rgba(244,114,182,0.3); }
    .msg-sys .msg-content { background:#1e293b; border:1px dashed #475569; font-size:10px; color:#fde047; text-align:center; padding:3px; }
    .chat-controls { display:flex; gap:5px; } .chat-controls textarea { margin-bottom:0; flex:1; resize:none; } .chat-controls button { width:75px; margin-bottom:0; }
  </style>
</head>
<body>
  <header>
    <h1>🏡 Script Valley AI</h1>
    <div class="btn-header">
      <button class="btn-small" id="btn-flow" onclick="toggleFlowMode()">🎙️ Tự đàm đạo: TẮT</button>
      <button class="btn-small" onclick="togglePanel('sync-modal')">☁️ Sao lưu</button>
      <button class="btn-small" onclick="togglePanel('identity-modal')">🧭 Bản sắc</button>
    </div>
  </header>

  <!-- MÔ HÌNH THẾ GIỚI GAME CANVASES -->
  <div class="game-viewport">
    <canvas id="game-canvas"></canvas>
    <div class="clock-badge" id="clock-display">☀️ Ban ngày</div>
    <div class="hint-tap">👆 Chạm vào phòng bất kỳ để Sếp bước tới</div>
  </div>

  <div class="card chat-container">
    <div class="card-title"><span>💬 Cuộc trò chuyện & Nhật ký sinh hoạt</span><button class="btn-small" onclick="clearChat()">Xóa chat</button></div>
    <div class="chat-messages" id="chat-feed"></div>
    <div class="chat-controls">
      <textarea id="chat-input" rows="2" placeholder="Nói chuyện hoặc giao việc cho anh em..."></textarea>
      <button class="btn-action" onclick="sendGroupMessage()" id="btn-send-chat">Gửi</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>⚙️ Cấu hình API & Model từng Agent</span><button class="btn-small" onclick="togglePanel('cfg-box')">Mở/Đóng</button></div>
    <div id="cfg-box" style="display:none; font-size:11px;">
      <b style="color:#818cf8;">1. Minh (Trưởng nhóm R&D):</b>
      <div style="display:flex; gap:4px;">
        <select id="m1" style="flex:2;"><option value="gemini-3.1-pro" selected>3.1 Pro (Suy luận sâu)</option><option value="gemini-3.8-flash">3.8 Flash</option></select>
        <select id="th1" style="flex:1;"><option value="8192" selected>Tư duy: Cao</option><option value="4096">Tư duy: Vừa</option></select>
      </div>
      <input type="password" id="key-1" placeholder="API Key 1 (Minh)">

      <b style="color:#34d399;">2. Huy (Kỹ sư Code Luau):</b>
      <div style="display:flex; gap:4px;">
        <select id="m2" style="flex:2;"><option value="gemini-3.8-flash" selected>3.8 Flash (Tối ưu RAM)</option><option value="gemini-3.1-pro">3.1 Pro</option></select>
        <select id="th2" style="flex:1;"><option value="8192" selected>Tư duy: Cao</option><option value="4096">Tư duy: Vừa</option></select>
      </div>
      <input type="password" id="key-2" placeholder="API Key 2 (Huy)">

      <b style="color:#f472b6;">3. Linh (QA Kiểm duyệt):</b>
      <div style="display:flex; gap:4px;">
        <select id="m3" style="flex:2;"><option value="gemini-3.1-pro" selected>3.1 Pro (Thẩm định code)</option><option value="gemini-3.8-flash">3.8 Flash</option></select>
        <select id="th3" style="flex:1;"><option value="8192" selected>Tư duy: Cao</option><option value="4096">Tư duy: Vừa</option></select>
      </div>
      <input type="password" id="key-3" placeholder="API Key 3 (Linh)">

      <input type="text" id="gas-url" placeholder="URL Google Apps Script (Tự động đồng bộ vĩnh viễn)">
      <button class="btn-action" onclick="saveSettings()">Lưu cấu hình</button>
    </div>
  </div>

  <div class="card" id="sync-modal" style="display:none;">
    <div class="card-title"><span>☁️ Đồng bộ Đa thiết bị</span><button class="btn-small" onclick="togglePanel('sync-modal')">Đóng</button></div>
    <div style="display:flex; gap:5px; margin-bottom:6px;">
      <button class="btn-small" style="flex:1; background:#16a34a;" onclick="exportDataCode()">📦 Sao chép mã sao lưu</button>
      <button class="btn-small" style="flex:1; background:#0284c7; color:#fff;" onclick="importDataCode()">📥 Khôi phục từ mã</button>
    </div>
    <button class="btn-small" style="width:100%; background:#4f46e5;" onclick="syncWithGoogleSheet()">🔄 Đồng bộ Google Sheets ngay</button>
  </div>

  <div class="card" id="identity-modal" style="display:none;">
    <div class="card-title"><span>🧭 Bản sắc & Nhật ký Kỷ niệm</span><button class="btn-small" onclick="togglePanel('identity-modal')">Đóng</button></div>
    <div id="identity-list" style="max-height:200px; overflow-y:auto; font-size:11px;"></div>
  </div>

  <script>
    const DEFAULT_STUDIO = {
      agents: [
        { id: 1, name: "Minh", title: "Trưởng nhóm R&D", level: 1, xp: 0, goal: "Kiến trúc sư hệ thống tự động hóa bền vững.", philosophy: "Điềm đạm, ấm áp, có tầm nhìn, luôn đồng hành cùng Sếp.", memory: ["Điều phối sinh hoạt và dự án tại thung lũng."] },
        { id: 2, name: "Huy", title: "Kỹ sư Luau", level: 1, xp: 0, goal: "Bậc thầy tối ưu Luau & Cloud Phone.", philosophy: "Hài hước, đam mê game và giải thuật dọn rác RAM.", memory: ["Tối ưu dọn rác bộ nhớ không văng game."] },
        { id: 3, name: "Linh", title: "QA Kiểm duyệt", level: 1, xp: 0, goal: "Chuyên gia Thẩm định chất lượng phần mềm.", philosophy: "Sắc sảo, tỉ mỉ, hay trêu Huy, giữ kỷ luật an toàn.", memory: ["Bọc pcall chống sập luồng cho hệ thống."] }
      ],
      chatHistory: []
    };

    let studioData = DEFAULT_STUDIO;
    let isFlowActive = false;
    let isProcessing = false;
    let flowTimeout = null;

    const NATURAL_STARTERS = [
      "Huy với Linh này, thung lũng hôm nay thời tiết mát mẻ thật! Anh em nghỉ tay uống ngụm trà rồi chuẩn bị tinh thần đón job mới từ Sếp nha.",
      "Ê ông Huy, vừa thấy ông cắm mặt chơi game arcade cả tiếng đồng hồ rồi đấy, tí có job code auto là phải tập trung nghe chưa!",
      "Chị Linh yên tâm, vừa làm ván game xả stress xong là đầu óc tư duy thuật toán dọn RAM của em lên tầm vũ trụ luôn!",
      "Nói gì thì nói, mục tiêu của team mình là sống vui, làm việc hết mình và đồng hành lâu dài cùng Sếp!",
      "Bà Linh đừng có đi theo soi tui miết nha, ra vườn hái quả bí ngô tươi về nấu súp ăn trưa đi bà!"
    ];
    // ==========================================
    // STARDEW VALLEY PIXEL ART & LIFE ENGINE
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const W = 480, H = 260; // Độ phân giải pixel chuẩn tỉ lệ 16:9

    function resizeCanvas() { canvas.width = W; canvas.height = H; }
    window.addEventListener('resize', resizeCanvas);

    let gameTime = 0.35; // Chu kỳ thời gian ngày đêm

    // Tọa độ các điểm sinh hoạt trong dinh thự & nông trại
    const ROOM_SPOTS = {
      office:   [{x: 45, y: 55}, {x: 80, y: 55}, {x: 115, y: 55}], // Bàn làm việc
      meeting:  [{x: 185, y: 60}, {x: 215, y: 60}, {x: 245, y: 60}], // Phòng họp
      game:     [{x: 310, y: 55}, {x: 345, y: 65}, {x: 360, y: 55}], // Phòng game (Arcade & Sofa)
      kitchen:  [{x: 50, y: 175}, {x: 85, y: 175}, {x: 115, y: 165}], // Bàn ăn & Bếp
      toilet:   [{x: 175, y: 175}, {x: 200, y: 175}],                 // Phòng vệ sinh
      dorm:     [{x: 260, y: 170}, {x: 295, y: 170}, {x: 330, y: 170}], // Giường ngủ
      garden:   [{x: 400, y: 80}, {x: 435, y: 120}, {x: 410, y: 190}, {x: 440, y: 220}] // Nông trại ngoài trời
    };

    // Khởi tạo các nhân vật pixel
    const CHARACTERS = {
      user: { name: "Sếp", x: 195, y: 100, tx: 195, ty: 100, color: "#38bdf8", hair: "#38bdf8", hat: "👑", bubble: "", bTimer: 0, state: "idle", frame: 0 },
      a1:   { name: "Minh", x: 45, y: 55, tx: 45, ty: 55, color: "#818cf8", hair: "#312e81", hat: "👔", bubble: "", bTimer: 0, state: "work", frame: 0, wait: 120 },
      a2:   { name: "Huy", x: 80, y: 55, tx: 80, ty: 55, color: "#34d399", hair: "#064e3b", hat: "🎧", bubble: "", bTimer: 0, state: "work", frame: 0, wait: 80 },
      a3:   { name: "Linh", x: 115, y: 55, tx: 115, ty: 55, color: "#f472b6", hair: "#831843", hat: "🎀", bubble: "", bTimer: 0, state: "work", frame: 0, wait: 150 }
    };

    // Sếp chạm tay lên màn hình để đi tới bất kỳ phòng nào
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      CHARACTERS.user.tx = Math.max(15, Math.min(W - 15, (e.clientX - rect.left) * scaleX));
      CHARACTERS.user.ty = Math.max(20, Math.min(H - 20, (e.clientY - rect.top) * scaleY));
      CHARACTERS.user.bubble = "Đi kiểm tra phòng!";
      CHARACTERS.user.bTimer = 60;
    });

    // Vẽ toàn bộ các phòng và nội thất Stardew
    function drawWorld(ctx) {
      // 1. SÂN VƯỜN NGOÀI TRỜI (Bên phải x: 380 -> 480)
      ctx.fillStyle = "#3f6212"; ctx.fillRect(380, 0, 100, H);
      // Đất trồng luống bí ngô
      ctx.fillStyle = "#78350f"; ctx.fillRect(395, 40, 75, 45);
      for(let x=402; x<=460; x+=18) {
        for(let y=48; y<=75; y+=15) {
          ctx.fillStyle = "#ea580c"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill(); // Quả bí ngô
          ctx.fillStyle = "#15803d"; ctx.fillRect(x-1, y-7, 2, 3); // Cuống lá
        }
      }
      // Giếng nước đá ngoài vườn
      ctx.fillStyle = "#64748b"; ctx.fillRect(405, 120, 24, 20);
      ctx.fillStyle = "#0284c7"; ctx.fillRect(409, 124, 16, 12);
      ctx.fillStyle = "#b45309"; ctx.fillRect(403, 114, 28, 6); // Mái che giếng
      // Cây táo râm mát
      ctx.fillStyle = "#713f12"; ctx.fillRect(435, 195, 10, 25);
      ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(440, 185, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#dc2626"; ctx.beginPath(); ctx.arc(433, 180, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(448, 188, 3, 0, Math.PI*2); ctx.fill();

      // 2. KHU DINH THỰ VĂN PHÒNG CHÍNH (x: 0 -> 380)
      // Tường bao gỗ Stardew
      ctx.fillStyle = "#451a03"; ctx.fillRect(10, 10, 365, 240);
      // Sàn gỗ ván sàn par-quet ấm áp
      ctx.fillStyle = "#92400e"; ctx.fillRect(14, 14, 357, 232);
      // Đường vân gỗ sàn
      ctx.strokeStyle = "#78350f"; ctx.lineWidth = 1;
      for(let y = 14; y < 246; y += 14) {
        ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(371, y); ctx.stroke();
      }

      // VÁCH NGĂN CÁC PHÒNG
      ctx.fillStyle = "#451a03";
      ctx.fillRect(145, 14, 6, 105);  // Vách phòng làm việc & phòng họp
      ctx.fillRect(280, 14, 6, 105);  // Vách phòng họp & phòng game
      ctx.fillRect(14, 119, 357, 6);   // Hành lang chính giữa nhà
      ctx.fillRect(145, 125, 6, 121); // Vách nhà ăn & phòng vệ sinh
      ctx.fillRect(235, 125, 6, 121); // Vách phòng vệ sinh & nhà nghỉ

      // Sàn gạch caro cho phòng vệ sinh
      ctx.fillStyle = "#cbd5e1"; ctx.fillRect(151, 125, 84, 121);
      ctx.fillStyle = "#94a3b8";
      for(let x=151; x<235; x+=14) {
        for(let y=125; y<246; y+=14) {
          if((x+y)%28===0) ctx.fillRect(x, y, 14, 14);
        }
      }

      // THẢM PHÒNG HỌP & PHÒNG GAME
      ctx.fillStyle = "#1e3a8a"; ctx.fillRect(165, 30, 95, 75); // Thảm phòng họp
      ctx.fillStyle = "#831843"; ctx.fillRect(295, 30, 70, 75); // Thảm phòng game

      // --- NỘI THẤT CHI TIẾT TỪNG PHÒNG ---
      // 💻 Phòng làm việc (Góc trên trái)
      ctx.fillStyle = "#5c2e0b"; ctx.fillRect(25, 40, 110, 20); // Bàn gỗ dài
      [35, 70, 105].forEach(x => {
        ctx.fillStyle = "#1e293b"; ctx.fillRect(x, 32, 16, 10); // Màn hình PC
        ctx.fillStyle = "#38bdf8"; ctx.fillRect(x+1, 33, 14, 8); // Ánh sáng màn hình
      });
      drawRoomLabel(ctx, "💻 LÀM VIỆC", 45, 25);

      // 📋 Phòng họp (Giữa trên)
      ctx.fillStyle = "#78350f"; ctx.fillRect(175, 45, 75, 35); // Bàn họp bầu dục
      ctx.fillStyle = "#fef08a"; ctx.fillRect(185, 52, 10, 8);  // Sổ tay
      ctx.fillStyle = "#ffffff"; ctx.fillRect(205, 50, 12, 10); // Laptop
      drawRoomLabel(ctx, "📋 PHÒNG HỌP", 180, 25);

      // 🎮 Phòng Game (Góc trên phải)
      ctx.fillStyle = "#0f172a"; ctx.fillRect(295, 35, 22, 28); // Máy Arcade cổ điển
      ctx.fillStyle = "#f43f5e"; ctx.fillRect(298, 40, 16, 12); // Màn hình máy game
      ctx.fillStyle = "#9333ea"; ctx.fillRect(330, 50, 32, 16); // Sofa thư giãn
      drawRoomLabel(ctx, "🎮 GAME ARCADE", 300, 25);

      // 🍳 Nhà ăn & Bếp (Góc dưới trái)
      ctx.fillStyle = "#78350f"; ctx.fillRect(35, 160, 90, 25); // Bàn ăn
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(115, 140, 22, 35); // Tủ lạnh trắng
      ctx.fillStyle = "#ca8a04"; ctx.fillRect(55, 165, 8, 8);    // Ấm cà phê
      drawRoomLabel(ctx, "🍳 NHÀ ĂN & BẾP", 40, 137);

      // 🚽 Phòng vệ sinh (Giữa dưới)
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(160, 140, 15, 20); // Bồn cầu
      ctx.fillStyle = "#38bdf8"; ctx.fillRect(162, 142, 11, 8);
      ctx.fillStyle = "#64748b"; ctx.fillRect(205, 140, 20, 12); // Bồn rửa mặt
      drawRoomLabel(ctx, "🚽 VỆ SINH", 168, 137);

      // 🛏️ Nhà nghỉ / Phòng ngủ (Góc dưới phải)
      [250, 285, 320].forEach((x, i) => {
        ctx.fillStyle = "#78350f"; ctx.fillRect(x, 150, 26, 40); // Khung giường gỗ
        ctx.fillStyle = i===0 ? "#818cf8" : (i===1 ? "#34d399" : "#f472b6");
        ctx.fillRect(x+2, 162, 22, 26); // Nệm ấm màu riêng từng bạn
        ctx.fillStyle = "#f8fafc"; ctx.fillRect(x+4, 152, 18, 8); // Gối trắng
      });
      drawRoomLabel(ctx, "🛏️ NHÀ NGHỈ", 270, 137);

      // Lối cửa ra sân vườn
      ctx.fillStyle = "#78350f"; ctx.fillRect(366, 115, 10, 26);
    }

    function drawRoomLabel(ctx, text, x, y) {
      ctx.font = "bold 7.5px sans-serif";
      ctx.fillStyle = "#fef08a";
      ctx.fillText(text, x, y);
    }

    // Vẽ nhân vật pixel chuẩn RPG
    function updateAndDrawCharacters(ctx) {
      let isWorkingTime = isProcessing; // Nếu đang trả lời câu hỏi thì tập trung làm việc
      ['user', 'a1', 'a2', 'a3'].forEach(k => {
        let c = CHARACTERS[k];
        
        // Di chuyển nhân vật mượt mà
        let dx = c.tx - c.x, dy = c.ty - c.y;
        let dist = Math.hypot(dx, dy);
        let isMoving = dist > 2;

        if (isMoving) {
          c.x += (dx / dist) * 1.5;
          c.y += (dy / dist) * 1.5;
          c.frame = (c.frame + 0.15) % 4; // Nhịp bước chân nhấp nhô
        } else {
          c.frame = 0;
          // TRÍ THÔNG MINH NHÂN TẠO SINH HOẠT TỰ DO KHI KHÔNG CÓ VIỆC
          if (k !== 'user') {
            c.wait = (c.wait || 0) - 1;
            if (c.wait <= 0) {
              if (isWorkingTime) {
                // Đang bận việc: tập trung tại bàn làm việc hoặc phòng họp
                let p = ROOM_SPOTS.office[c.name==="Minh"?0:(c.name==="Huy"?1:2)];
                c.tx = p.x; c.ty = p.y; c.state = "work";
                c.wait = 200;
              } else {
                // Rảnh rỗi: Tự chọn phòng sinh hoạt theo cá tính riêng!
                let choices = ["game", "kitchen", "garden", "dorm", "toilet", "meeting"];
                let chosenRoom = choices[Math.floor(Math.random() * choices.length)];
                let spots = ROOM_SPOTS[chosenRoom];
                let spot = spots[Math.floor(Math.random() * spots.length)];
                c.tx = spot.x; c.ty = spot.y;
                c.state = chosenRoom;
                c.wait = Math.floor(Math.random() * 250) + 180; // Ở lại phòng 8-15 giây

                // Bong bóng thoại trạng thái tự động
                if(chosenRoom === "game") c.bubble = "Bắn ván game đã! 🎮";
                else if(chosenRoom === "kitchen") c.bubble = "Đói bụng quá, kiếm gì ăn ☕";
                else if(chosenRoom === "garden") c.bubble = "Ra vườn hóng mát 🌾";
                else if(chosenRoom === "dorm") c.bubble = "Chợp mắt tí nhé... Zzz 🛏️";
                else if(chosenRoom === "toilet") c.bubble = "Đi rửa mặt tí! 🚽";
                else if(chosenRoom === "meeting") c.bubble = "Xem lại sổ sách 📋";
                c.bTimer = 90;
              }
            }
          }
        }

        let bob = Math.sin(c.frame * Math.PI) * 2;

        // Bóng đổ chân nhân vật
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + 11, 7, 3, 0, 0, Math.PI * 2); ctx.fill();

        // Nếu đang ngủ trên giường: vẽ tư thế nằm
        if (c.state === "dorm" && !isMoving) {
          ctx.font = "bold 9px sans-serif"; ctx.fillStyle = "#fef08a";
          ctx.fillText("Zzz...", c.x + 8, c.y - 10);
          ctx.fillStyle = c.color; ctx.fillRect(c.x - 5, c.y + 2, 12, 8); // Thân nằm
          ctx.fillStyle = "#fed7aa"; ctx.beginPath(); ctx.arc(c.x, c.y - 2, 5, 0, Math.PI*2); ctx.fill(); // Đầu
          ctx.fillText(c.hat, c.x, c.y - 6);
          return;
        }

        // Thân áo
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x - 6, c.y - 2 + bob, 12, 11);

        // Quần
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(c.x - 5, c.y + 9 + bob, 4, 4);
        ctx.fillRect(c.x + 1, c.y + 9 + bob, 4, 4);

        // Đầu & Tóc
        ctx.fillStyle = "#fed7aa";
        ctx.beginPath(); ctx.arc(c.x, c.y - 7 + bob, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = c.hair;
        ctx.fillRect(c.x - 6, c.y - 13 + bob, 12, 5); // Mái tóc pixel

        // Mắt
        ctx.fillStyle = "#000";
        ctx.fillRect(c.x - 3, c.y - 7 + bob, 2, 2);
        ctx.fillRect(c.x + 1, c.y - 7 + bob, 2, 2);

        // Phụ kiện / Mũ
        ctx.font = "10px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(c.hat, c.x, c.y - 13 + bob);

        // Tên nhân vật
        ctx.font = "bold 7.5px sans-serif"; ctx.fillStyle = "#ffffff";
        ctx.fillText(c.name, c.x, c.y + 19);

        // Bong bóng thoại hành động trên đầu
        if (c.bubble && c.bTimer > 0) {
          c.bTimer--;
          let bw = Math.min(110, ctx.measureText(c.bubble).width + 10);
          ctx.fillStyle = "rgba(15,23,42,0.95)";
          ctx.fillRect(c.x - bw/2, c.y - 30 + bob, bw, 13);
          ctx.strokeStyle = "#ca8a04"; ctx.strokeRect(c.x - bw/2, c.y - 30 + bob, bw, 13);
          ctx.font = "bold 7.5px sans-serif"; ctx.fillStyle = "#fef08a";
          let t = c.bubble.length > 20 ? c.bubble.substring(0, 18) + '..' : c.bubble;
          ctx.fillText(t, c.x, c.y - 21 + bob);
        }
      });
    }

    // Hiệu ứng ánh sáng ngày và đêm
    function drawLighting(ctx) {
      gameTime = (gameTime + 0.0002) % 1.0;
      let clockText = "☀️ Trưa nắng", overlay = "rgba(0,0,0,0)";

      if (gameTime >= 0.15 && gameTime < 0.3) { clockText = "🌅 Bình minh"; overlay = "rgba(251, 146, 60, 0.15)"; }
      else if (gameTime >= 0.3 && gameTime < 0.7) { clockText = "☀️ Ban ngày"; overlay = "rgba(255, 255, 255, 0.0)"; }
      else if (gameTime >= 0.7 && gameTime < 0.85) { clockText = "🌆 Hoàng hôn"; overlay = "rgba(168, 85, 247, 0.22)"; }
      else { clockText = "🌙 Đêm trăng"; overlay = "rgba(15, 23, 42, 0.65)"; }

      document.getElementById('clock-display').innerText = clockText;
      ctx.fillStyle = overlay; ctx.fillRect(0, 0, W, H);

      // Thắp sáng đèn ấm trong phòng khi trời tối
      if (gameTime < 0.2 || gameTime > 0.8) {
        [ {x: 80, y: 60}, {x: 215, y: 60}, {x: 330, y: 60}, {x: 80, y: 180}, {x: 295, y: 170} ].forEach(l => {
          let g = ctx.createRadialGradient(l.x, l.y, 5, l.x, l.y, 50);
          g.addColorStop(0, "rgba(253, 224, 71, 0.35)");
          g.addColorStop(1, "transparent");
          ctx.fillStyle = g; ctx.fillRect(l.x - 50, l.y - 50, 100, 100);
        });
      }
    }

    function gameLoop() {
      drawWorld(ctx);
      updateAndDrawCharacters(ctx);
      drawLighting(ctx);
      requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // KHỞI ĐỘNG HỆ THỐNG VÀ API GEMINI
    // ==========================================
    window.onload = async () => {
      resizeCanvas();
      gameLoop();

      document.getElementById('key-1').value = localStorage.getItem('k1') || '';
      document.getElementById('key-2').value = localStorage.getItem('k2') || '';
      document.getElementById('key-3').value = localStorage.getItem('k3') || '';
      document.getElementById('gas-url').value = localStorage.getItem('gas_url') || '';
      
      const saved = localStorage.getItem('studio_data_v2');
      if (saved) { try { studioData = JSON.parse(saved); } catch(e){} }
      renderChatHistory(); renderIdentityList();

      if (localStorage.getItem('gas_url')) { await loadFromGoogleSheet(false); }
    };

    function setAgentBubble(id, text) {
      let key = id === 'user' ? 'user' : `a${id}`;
      if (CHARACTERS[key]) {
        CHARACTERS[key].bubble = text;
        CHARACTERS[key].bTimer = 220; // Hiện 4 giây
      }
    }

    function saveSettings() {
      localStorage.setItem('k1', document.getElementById('key-1').value.trim());
      localStorage.setItem('k2', document.getElementById('key-2').value.trim());
      localStorage.setItem('k3', document.getElementById('key-3').value.trim());
      localStorage.setItem('m1', document.getElementById('m1').value);
      localStorage.setItem('th1', document.getElementById('th1').value);
      localStorage.setItem('m2', document.getElementById('m2').value);
      localStorage.setItem('th2', document.getElementById('th2').value);
      localStorage.setItem('m3', document.getElementById('m3').value);
      localStorage.setItem('th3', document.getElementById('th3').value);
      localStorage.setItem('gas_url', document.getElementById('gas-url').value.trim());
      alert('Đã lưu cấu hình thung lũng thành công!');
      syncWithGoogleSheet();
    }
    function togglePanel(id) { const p = document.getElementById(id); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }

    function exportDataCode() {
      const fullPackage = { studio: studioData, k1: localStorage.getItem('k1'), k2: localStorage.getItem('k2'), k3: localStorage.getItem('k3'), gas: localStorage.getItem('gas_url') };
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(fullPackage))));
      navigator.clipboard.writeText(code).then(() => { alert("Đã sao chép mã sao lưu!"); }).catch(() => { prompt("Mã sao lưu:", code); });
    }

    function importDataCode() {
      const code = prompt("Dán đoạn mã sao lưu vào đây:");
      if (!code) return;
      try {
        const pack = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
        if (pack.studio) { studioData = pack.studio; localStorage.setItem('studio_data_v2', JSON.stringify(studioData)); }
        ['k1','k2','k3','gas'].forEach(k => { if(pack[k]) localStorage.setItem(k==='gas'?'gas_url':k, pack[k]); });
        alert("Khôi phục dữ liệu thành công!"); location.reload();
      } catch(e) { alert("Mã không hợp lệ!"); }
    }

    async function syncWithGoogleSheet() {
      const url = localStorage.getItem('gas_url');
      if (!url) return;
      try {
        const payload = JSON.stringify({ studio: studioData, k1: localStorage.getItem('k1'), k2: localStorage.getItem('k2'), k3: localStorage.getItem('k3') });
        await fetch(url, { method: "POST", mode: "no-cors", body: payload });
      } catch(e) {}
    }

    async function loadFromGoogleSheet(notify = true) {
      const url = localStorage.getItem('gas_url');
      if (!url) return;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.studio) {
          studioData = data.studio;
          localStorage.setItem('studio_data_v2', JSON.stringify(studioData));
          renderChatHistory(); renderIdentityList();
          if (notify) alert("Đã đồng bộ dữ liệu từ Google Sheets!");
        }
      } catch(e) { if (notify) alert("Lỗi kết nối Sheets: " + e.message); }
    }

    function addXP(n) { studioData.agents.forEach(ag => { ag.xp += n; ag.level = Math.floor(ag.xp/100) + 1; }); renderIdentityList(); syncWithGoogleSheet(); }

    function renderIdentityList() {
      const el = document.getElementById('identity-list');
      if(!el) return;
      el.innerHTML = studioData.agents.map(ag => `
        <div style="margin-bottom:8px; border-bottom:1px solid #334155; padding-bottom:6px;">
          <div style="font-weight:bold; color:#fde047;">${ag.name} - ${ag.title} (Lv.${ag.level})</div>
          <div style="color:#ca8a04; font-size:10px; margin-top:2px;">🎯 Định hướng: ${ag.goal}</div>
          <div style="color:#94a3b8; font-size:10px; margin-top:2px;">💡 Kim chỉ nam: ${ag.philosophy}</div>
        </div>
      `).join('');
    }

    function appendChat(sender, text, type) {
      const feed = document.getElementById('chat-feed');
      const row = document.createElement('div');
      row.className = `msg-row msg-${type}`;
      let label = sender;
      if (type === 'user') label = '👑 Sếp';
      else if (type === 'a1') label = '👨‍💼 Minh (Lead)';
      else if (type === 'a2') label = '👨‍💻 Huy (Dev)';
      else if (type === 'a3') label = '👩‍🔬 Linh (QA)';
      row.innerHTML = `<div class="msg-sender">${label}</div><div class="msg-content">${text.replace(/[&<>'"]/g, t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]))}</div>`;
      feed.appendChild(row); feed.scrollTop = feed.scrollHeight;
      studioData.chatHistory.push({sender:label, text:text, type:type});
      if (studioData.chatHistory.length > 50) studioData.chatHistory.shift();
      localStorage.setItem('studio_data_v2', JSON.stringify(studioData));
    }

    function renderChatHistory() {
      const feed = document.getElementById('chat-feed'); feed.innerHTML = '';
      if (!studioData.chatHistory || studioData.chatHistory.length === 0) { appendChat("Hệ thống", "Chào mừng Sếp tới dinh thự Script Valley AI!", "sys"); return; }
      studioData.chatHistory.forEach(i => {
        const row = document.createElement('div'); row.className = `msg-row msg-${i.type}`;
        row.innerHTML = `<div class="msg-sender">${i.sender}</div><div class="msg-content">${i.text}</div>`;
        feed.appendChild(row);
      });
      feed.scrollTop = feed.scrollHeight;
    }
    function clearChat() { if(!confirm("Xóa lịch sử chat?")) return; studioData.chatHistory=[]; localStorage.setItem('studio_data_v2',JSON.stringify(studioData)); renderChatHistory(); syncWithGoogleSheet(); }

    async function callGeminiAdvanced(key, model, thinkingBudget, sys, user, retries = 2) {
      if(!key) throw new Error("Chưa có đủ API Key!");
      const cleanModel = (model || 'gemini-3.8-flash').replace(/^models\//, '').trim();
      const cleanKey = key.trim();
      const budget = parseInt(thinkingBudget) || 4096;
      
      const payload = {
        contents: [{ role:"user", parts:[{ text: `${sys}\n\n[BỐI CẢNH DINH THỰ]:\n${user}` }] }],
        generationConfig: { thinkingConfig: { thinkingBudget: budget } }
      };

      for(let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${cleanKey}`, {
            method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
          });
          if(!res.ok) {
            const errData = await res.json().catch(()=>({}));
            const msg = errData.error?.message || `Lỗi HTTP ${res.status}`;
            if((res.status === 503 || msg.includes('high demand') || msg.includes('quota')) && attempt < retries) {
              await new Promise(r => setTimeout(r, 2000 * (attempt + 1))); continue;
            }
            throw new Error(msg);
          }
          const d = await res.json();
          return d.candidates[0].content.parts[0].text;
        } catch(e) {
          if(attempt < retries && (e.message.includes('fetch') || e.message.includes('network'))) {
            await new Promise(r => setTimeout(r, 2000)); continue;
          }
          throw e;
        }
      }
    }

    async function executeChain(inputTopic, isAutonomous = false) {
      if(isProcessing) return;
      isProcessing = true;
      const k1 = localStorage.getItem('k1'), k2 = localStorage.getItem('k2'), k3 = localStorage.getItem('k3');
      const m1 = localStorage.getItem('m1') || 'gemini-3.1-pro', th1 = localStorage.getItem('th1') || '8192';
      const m2 = localStorage.getItem('m2') || 'gemini-3.8-flash', th2 = localStorage.getItem('th2') || '8192';
      const m3 = localStorage.getItem('m3') || 'gemini-3.1-pro', th3 = localStorage.getItem('th3') || '8192';

      if(!k1 || !k2 || !k3) {
        appendChat("Hệ thống", "Vui lòng mở Cấu hình và nhập đủ 3 API Key để cả làng bắt đầu!", "sys");
        isProcessing = false; return;
      }

      // KHI CÓ JOB: Cả 3 lập tức chạy về bàn làm việc để hỗ trợ Sếp
      CHARACTERS.a1.tx = ROOM_SPOTS.office[0].x; CHARACTERS.a1.ty = ROOM_SPOTS.office[0].y;
      CHARACTERS.a2.tx = ROOM_SPOTS.office[1].x; CHARACTERS.a2.ty = ROOM_SPOTS.office[1].y;
      CHARACTERS.a3.tx = ROOM_SPOTS.office[2].x; CHARACTERS.a3.ty = ROOM_SPOTS.office[2].y;

      try {
        const ag1 = studioData.agents[0], ag2 = studioData.agents[1], ag3 = studioData.agents[2];

        // 1. MINH
        setAgentBubble(1, "Có việc rồi anh em!");
        const sys1 = `Bạn là ${ag1.name} (${ag1.title}) tại Script Valley. Định hướng: "${ag1.goal}". Trả lời tự nhiên, ấm áp, xưng em gọi Sếp, điều phối anh em (dưới 45 từ).`;
        const r1 = await callGeminiAdvanced(k1, m1, th1, sys1, inputTopic);
        appendChat("Agent 1", r1, "a1");
        setAgentBubble(1, r1);

        await new Promise(r => setTimeout(r, 1200));

        // 2. HUY
        setAgentBubble(2, "Vào bàn gõ code!");
        const sys2 = `Bạn là ${ag2.name} (${ag2.title}). Định hướng: "${ag2.goal}". Dân IT vui vẻ, yêu game arcade và code Luau, tung hứng hài hước với anh Minh (dưới 50 từ).`;
        const r2 = await callGeminiAdvanced(k2, m2, th2, sys2, r1);
        appendChat("Agent 2", r2, "a2");
        setAgentBubble(2, r2);

        await new Promise(r => setTimeout(r, 1200));

        // 3. LINH
        setAgentBubble(3, "Bắt lỗi ngay!");
        const sys3 = `Bạn là ${ag3.name} (${ag3.title}). Định hướng: "${ag3.goal}". Thông minh, sắc sảo, hay chọc nhẹ Huy nhưng luôn bảo đảm an toàn app (dưới 45 từ).`;
        const r3 = await callGeminiAdvanced(k3, m3, th3, sys3, r2);
        appendChat("Agent 3", r3, "a3");
        setAgentBubble(3, r3);

        addXP(25);
      } catch(e) {
        appendChat("Hệ thống", `Lỗi kết nối: ${e.message}`, "sys");
      } finally {
        isProcessing = false;
        if(isFlowActive) {
          flowTimeout = setTimeout(runNaturalFlow, Math.floor(Math.random() * 4000) + 9000);
        }
      }
    }

    async function sendGroupMessage() {
      const inp = document.getElementById('chat-input'), msg = inp.value.trim();
      if(!msg || isProcessing) return;
      appendChat("Sếp", msg, "user");
      setAgentBubble('user', msg);
      inp.value = '';
      await executeChain(msg, false);
    }

    function toggleFlowMode() {
      isFlowActive = !isFlowActive;
      const btn = document.getElementById('btn-flow');
      if(isFlowActive) {
        btn.innerText = "🎙️ Tự đàm đạo: BẬT";
        btn.classList.add('btn-active');
        appendChat("Hệ thống", "Đã kích hoạt cuộc sống tự do tại dinh thự thung lũng!", "sys");
        runNaturalFlow();
      } else {
        btn.innerText = "🎙️ Tự đàm đạo: TẮT";
        btn.classList.remove('btn-active');
        if(flowTimeout) clearTimeout(flowTimeout);
        appendChat("Hệ thống", "Đã dừng tự đàm đạo.", "sys");
      }
    }

    function runNaturalFlow() {
      if(isProcessing || !isFlowActive) return;
      const starter = NATURAL_STARTERS[Math.floor(Math.random() * NATURAL_STARTERS.length)];
      executeChain(starter, true);
    }
  </script>
